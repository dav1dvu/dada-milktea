<noscript><p style="padding:20px;color:#fff">Game cần bật JavaScript.</p></noscript>
<script>
// Lỗi xảy ra trước khi js/errors.js nạp xong: giữ lại để báo sau
window.__errQ = [];
addEventListener('error', function (e) { if (!window.__errOn) __errQ.push([String(e.message || ''), e.error && e.error.stack || '', e.filename || '']); });
addEventListener('unhandledrejection', function (e) { var r = e.reason; if (!window.__errOn) __errQ.push([String(r && r.message || r), r && r.stack || '', '']); });

// Đăng ký Service Worker cho trải nghiệm PWA và bộ nhớ đệm ngoại tuyến
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('ServiceWorker registration error:', err);
    });
  });
}
</script>
<script type="module" src="./js/main.js"></script>
