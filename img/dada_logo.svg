<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" aria-label="Dada Milktea Logo">
  <defs>
    <!-- Background & Aura Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#F7EBE1"/>
      <stop offset="100%" stop-color="#EDDAC9"/>
    </radialGradient>
    <radialGradient id="haloGlow" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#FF8A80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F7EBE1" stop-opacity="0"/>
    </radialGradient>

    <!-- Tea & Milk Gradients -->
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97724"/>
      <stop offset="35%" stop-color="#A75317"/>
      <stop offset="100%" stop-color="#3E2A22"/>
    </linearGradient>
    <linearGradient id="creamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFF3E8"/>
      <stop offset="100%" stop-color="#F7EBE1"/>
    </linearGradient>
    <linearGradient id="goldenPearl" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#C67D00"/>
    </linearGradient>
    <linearGradient id="strawGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="50%" stop-color="#FFA49C"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>

    <!-- Gold Foil Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cupOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E7368"/>
      <stop offset="100%" stop-color="#3E2A22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3E2A22" flood-opacity="0.16"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3E2A22" flood-opacity="0.22"/>
    </filter>
    <filter id="glowGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cup Body Clip -->
    <clipPath id="cupInteriorClip">
      <path d="M195,160 L405,160 L382,342 Q380,360 360,360 L240,360 Q220,360 218,342 Z"/>
    </clipPath>
  </defs>

  <!-- Base Circle Frame / Emblem Canvas -->
  <circle cx="300" cy="300" r="280" fill="url(#bgGlow)" stroke="#F7EBE1" stroke-width="4"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#D97724" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.65"/>
  <circle cx="300" cy="245" r="175" fill="url(#haloGlow)"/>

  <!-- Decorative Sparkles / Floating Boba -->
  <g fill="#FFB300" opacity="0.85">
    <!-- Top-left sparkle -->
    <path d="M135,165 Q145,165 145,155 Q145,165 155,165 Q145,165 145,175 Q145,165 135,165 Z"/>
    <!-- Top-right sparkle -->
    <path d="M445,145 Q457,145 457,133 Q457,145 469,145 Q457,145 457,157 Q457,145 445,145 Z"/>
    <!-- Mid-right small star -->
    <path d="M465,260 Q472,260 472,253 Q472,260 479,260 Q472,260 472,267 Q472,260 465,260 Z"/>
    <!-- Mid-left small star -->
    <path d="M125,270 Q132,270 132,263 Q132,270 139,270 Q132,270 132,277 Q132,270 125,270 Z"/>
  </g>

  <!-- Cup Ground Shadow -->
  <ellipse cx="300" cy="368" rx="85" ry="12" fill="#3E2A22" opacity="0.14"/>

  <!-- Straw (Back segment behind lid) -->
  <g class="straw" transform="rotate(14 330 90)">
    <rect x="320" y="42" width="22" height="125" rx="11" fill="url(#strawGradient)" stroke="#3E2A22" stroke-width="3"/>
    <!-- Straw stripes -->
    <path d="M320,60 L342,70 M320,85 L342,95 M320,110 L342,120 M320,135 L342,145" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Main Cup Container with Soft Shadow -->
  <g filter="url(#softShadow)">
    <!-- Cup Interior Layers (Clipped) -->
    <g clip-path="url(#cupInteriorClip)">
      <!-- Liquid Background Base -->
      <rect x="180" y="150" width="240" height="220" fill="url(#teaGradient)"/>

      <!-- Milk Wave Layer -->
      <path d="M180,185 Q235,200 290,188 T420,190 L420,150 L180,150 Z" fill="url(#creamGradient)"/>
      <path d="M180,188 Q240,172 300,185 T420,178 L420,150 L180,150 Z" fill="#FFFFFF" opacity="0.6"/>

      <!-- Golden Tapioca Pearls at Bottom -->
      <!-- Bottom Layer Pearls -->
      <circle cx="245" cy="336" r="15" fill="url(#goldenPearl)"/>
      <circle cx="275" cy="340" r="16" fill="url(#goldenPearl)"/>
      <circle cx="305" cy="338" r="15.5" fill="url(#goldenPearl)"/>
      <circle cx="335" cy="341" r="16" fill="url(#goldenPearl)"/>
      <circle cx="358" cy="335" r="14.5" fill="url(#goldenPearl)"/>

      <!-- Second Row Pearls -->
      <circle cx="230" cy="320" r="15" fill="url(#goldenPearl)"/>
      <circle cx="260" cy="322" r="15.5" fill="url(#goldenPearl)"/>
      <circle cx="290" cy="324" r="16" fill="url(#goldenPearl)"/>
      <circle cx="320" cy="323" r="15.5" fill="url(#goldenPearl)"/>
      <circle cx="350" cy="318" r="15" fill="url(#goldenPearl)"/>

      <!-- Top Row Floating Pearls -->
      <circle cx="246" cy="302" r="14" fill="url(#goldenPearl)"/>
      <circle cx="280" cy="305" r="15" fill="url(#goldenPearl)"/>
      <circle cx="312" cy="304" r="14.5" fill="url(#goldenPearl)"/>
      <circle cx="340" cy="301" r="13.5" fill="url(#goldenPearl)"/>

      <!-- Pearl Highlights (Specular Shine) -->
      <g fill="#FFFFFF" opacity="0.85">
        <circle cx="241" cy="331" r="4"/>
        <circle cx="271" cy="335" r="4.2"/>
        <circle cx="301" cy="333" r="4"/>
        <circle cx="331" cy="336" r="4.2"/>
        <circle cx="226" cy="315" r="3.8"/>
        <circle cx="256" cy="317" r="4"/>
        <circle cx="286" cy="319" r="4"/>
        <circle cx="316" cy="318" r="4"/>
        <circle cx="276" cy="300" r="3.5"/>
        <circle cx="308" cy="299" r="3.5"/>
      </g>

      <!-- Glass Reflection Highlight (Left edge) -->
      <path d="M205,160 L216,335 Q220,348 228,348 L222,160 Z" fill="#FFFFFF" opacity="0.32"/>
    </g>

    <!-- Transparent Cup Outline -->
    <path d="M195,160 L405,160 L382,342 Q380,360 360,360 L240,360 Q220,360 218,342 Z"
          fill="none" stroke="url(#cupOutline)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Cup Dome Lid (Cream Cap) -->
    <path d="M182,162 Q300,104 418,162 Z" fill="#FFFFFF" opacity="0.95" stroke="#3E2A22" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="300" cy="162" rx="122" ry="12" fill="#F7EBE1" stroke="#3E2A22" stroke-width="4"/>
    <ellipse cx="300" cy="160" rx="105" ry="7" fill="#FFFFFF" opacity="0.75"/>

    <!-- Little Golden Star / Crown on the Lid -->
    <path d="M300,98 L305,110 L318,111 L308,119 L311,131 L300,124 L289,131 L292,119 L282,111 L295,110 Z"
          fill="url(#goldTextGrad)" stroke="#3E2A22" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="300" cy="116" r="2.5" fill="#FFFFFF"/>

    <!-- Chibi Cute Face on Cup -->
    <g class="chibi-face">
      <!-- Big Sparkling Anime Eyes -->
      <!-- Left Eye -->
      <ellipse cx="266" cy="235" rx="10" ry="13" fill="#3E2A22"/>
      <ellipse cx="263" cy="230" rx="4.5" ry="5.5" fill="#FFFFFF"/>
      <circle cx="269" cy="240" r="2.2" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <ellipse cx="334" cy="235" rx="10" ry="13" fill="#3E2A22"/>
      <ellipse cx="331" cy="230" rx="4.5" ry="5.5" fill="#FFFFFF"/>
      <circle cx="337" cy="240" r="2.2" fill="#FFFFFF"/>

      <!-- Rosy Blush Cheeks -->
      <ellipse cx="244" cy="250" rx="12" ry="7" fill="#FF8A80" opacity="0.65"/>
      <ellipse cx="356" cy="250" rx="12" ry="7" fill="#FF8A80" opacity="0.65"/>

      <!-- Sweet Happy Mouth -->
      <path d="M288,245 Q300,260 312,245 Q300,250 288,245 Z" fill="#E53935" stroke="#3E2A22" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Smile Tongue Highlight -->
      <path d="M294,250 Q300,257 306,250 Z" fill="#FFCDD2"/>
    </g>

    <!-- Chibi Cute Waving Hands -->
    <!-- Left Hand -->
    <path d="M198,245 Q176,240 178,226 Q184,218 196,230" fill="#F7EBE1" stroke="#3E2A22" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Hand Waving -->
    <path d="M402,242 Q426,232 425,218 Q416,212 404,228" fill="#F7EBE1" stroke="#3E2A22" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography Section -->
  <!-- Main Name: DADA -->
  <g filter="url(#badgeShadow)">
    <!-- Darker 3D Block Shadow for DADA -->
    <text x="300" y="440"
          font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif"
          font-weight="900"
          font-size="64"
          text-anchor="middle"
          fill="#3E2A22"
          letter-spacing="0.08em">DADA</text>

    <!-- Foreground DADA Text -->
    <text x="300" y="436"
          font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif"
          font-weight="900"
          font-size="64"
          text-anchor="middle"
          fill="url(#goldTextGrad)"
          stroke="#3E2A22"
          stroke-width="3"
          stroke-linejoin="round"
          letter-spacing="0.08em">DADA</text>
  </g>

  <!-- Secondary Wordmark: MILKTEA -->
  <g>
    <!-- Background Ribbon / Pill -->
    <rect x="180" y="456" width="240" height="34" rx="17" fill="#3E2A22"/>
    <text x="300" y="479"
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
          font-weight="800"
          font-size="19"
          text-anchor="middle"
          fill="#F7EBE1"
          letter-spacing="0.32em">MILKTEA</text>
  </g>

  <!-- Slogan / Subtitle Pill -->
  <g>
    <rect x="140" y="504" width="320" height="26" rx="13" fill="#FFFFFF" stroke="#D97724" stroke-width="1.5"/>
    <text x="300" y="521"
          font-family="'Baloo 2', 'Segoe UI', sans-serif"
          font-weight="700"
          font-size="12"
          text-anchor="middle"
          fill="#D97724"
          letter-spacing="0.12em">TIỆM TRÀ SỮA THỦ CÔNG · SINCE 2024</text>
  </g>

  <!-- Little Matcha Leaf Accent on Ribbon -->
  <path d="M410,454 C422,444 430,450 428,460 C420,466 414,460 410,454 Z" fill="#81C784" stroke="#3E2A22" stroke-width="1.5"/>
  <path d="M414,457 C418,455 423,456 425,458" stroke="#3E2A22" stroke-width="1" fill="none"/>
</svg>
